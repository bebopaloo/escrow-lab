# SBOM for a Release (ADR 0014, module release_record, work item C9.4).
# A reusable workflow: the production deploy workflow (ADR 0015, R8.1) calls it for the
# commit that it deploys, and perform-release puts the digest in the Release record.
# Signing the SBOM and the build needs cloud credentials, so the deploy workflow does it.
# context-init writes this file to .github/workflows/sbom.yml.
name: SBOM

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to describe; default the commit of the calling run
        type: string
        default: ""
    outputs:
      digest:
        description: The sha256 digest of the CycloneDX SBOM file
        value: ${{ jobs.sbom.outputs.digest }}

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Syft runs from an image pinned by digest, at a release more than 14 days old.
      - name: CycloneDX SBOM
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
          dir:/src --exclude ./.git -o cyclonedx-json=sbom.cdx.json
      - name: Digest
        id: digest
        run: |
          digest="sha256:$(sha256sum sbom.cdx.json | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### SBOM: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.ref || github.sha }}
          path: sbom.cdx.json
          retention-days: 400
