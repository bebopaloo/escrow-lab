# Control register (ADR 0014, module control_register).
#
# Each [[control]] is one requirement that the product must meet, with the
# modules that implement it and the evidence that proves it. A Control needs at
# least one tagged test or one manual check. `controls.py validate` checks it,
# and `controls.py matrix` builds the traceability matrix from JUnit reports.
#
# A test carries a Control ID in its name:
#   TypeScript: it("[CTRL-PAY-03] refuses a release without approval", ...)
#   Python:     def test_ctrl_pay_03_refuses_a_release_without_approval():
#
# Keys: id (CTRL-<AREA>-<n>), title, owner, modules (path globs), and the
# optional sources (regulations, ADRs) and manual_checks.
#
# `tests` lists the globs of the test files to scan. Leave it out to use the
# defaults: *.test.ts(x), *.spec.ts(x), test_*.py, *_test.py, *_test.go.
#
[[control]]
id = "CTRL-PAY-01"
title = "No party to a Deal can authorise its Payout: only an Approver can"
owner = "Operator"
modules = ["apps/api/src/modules/approval/**", "apps/api/src/modules/payout/**"]

[[control]]
id = "CTRL-PAY-02"
title = "A charge or a transfer happens at most once for each instruction"
owner = "Operator"
modules = [
  "apps/api/src/modules/approval/**",
  "apps/api/src/modules/payout/**",
  "apps/api/src/modules/ledger/**",
  "apps/api/src/adapters/**",
]

[[control]]
id = "CTRL-LED-01"
title = "No one can change or delete a ledger record"
owner = "Operator"
modules = ["apps/api/src/modules/ledger/**", "packages/db/migrations/**"]

[[control]]
id = "CTRL-AUD-01"
title = "Each money or authority action records who did it and when"
owner = "Operator"
modules = ["apps/api/src/modules/audit/**", "apps/api/src/modules/approval/**", "apps/api/src/modules/payout/**"]

[[control]]
id = "CTRL-REL-01"
title = "Only reviewed and approved code reaches production"
sources = ["ADR 0015 of the factory"]
owner = "Operator"
modules = [".github/workflows/**"]
manual_checks = [
  "Only a release pull request that passed review-release and has the Operator's Release approval merges into production",
  "Only deploy-production.yml uses the production environment; the release-separation check proves it on each pull request",
]
